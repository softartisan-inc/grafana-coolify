      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-90d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-100GB}
      - --enable-feature=${PROM_ENABLE_FEATURES:-}
    volumes:
      - type: bind
        source: ./config/prometheus/prometheus.6e92fe28.yml
        target: /etc/prometheus/prometheus.6e92fe28.yml
        content: |2
          # Prometheus configuration for grafana-coolify.
          # Flags (listen address, OTLP and remote-write receivers, retention, feature flags) are in the
          # `command:` of compose.template.yaml: that is the only place Compose interpolates variables.
          global:
            scrape_interval: 30s
            evaluation_interval: 30s

          # OTLP: project, env and tenant become labels instead of ending in target_info.
          # service.name is always translated to `job` (spec 6.2).
          otlp:
            promote_resource_attributes:
              - project
              - env
              - tenant

          storage:
            tsdb:
              out_of_order_time_window: 30m

          # Internal scrape of the stack (spec 7.4). Names resolve inside the package network.
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["prometheus:9090"]
            - job_name: loki
              static_configs:
                - targets: ["loki:3100"]
            - job_name: tempo
              static_configs:
                - targets: ["tempo:3200"]
            - job_name: alloy
              static_configs:
                - targets: ["alloy:12345"]
            - job_name: alloy-gateway
              static_configs:
                - targets: ["alloy-gateway:12345"]
            - job_name: node-exporter
              static_configs:
                - targets: ["node-exporter:9100"]
        read_only: true
      - prometheus-data:/prometheus
    expose:
      - "9090"
    mem_limit: 1536m
    cpus: 1.0

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    depends_on:
      config-guard:
        condition: service_completed_successfully
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --web.listen-address=0.0.0.0:9100
    # Short syntax on purpose: Coolify drops `read_only: true` of a long-syntax bind mount.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    expose:
      - "9100"
    mem_limit: 64m
    cpus: 0.2

  alloy:
    image: grafana/alloy:v1.20.0
    restart: unless-stopped
    depends_on:
      config-guard:
        condition: service_completed_successfully
    user: "473:473"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - /etc/alloy/config.bd379961.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview
    environment:
      SERVICE_FQDN_ALLOY_12347:
      BIND_ADDR: 0.0.0.0
      ALLOY_QUEUE_DIR: /var/lib/alloy/queue
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT is required}
      FARO_API_KEY: ${FARO_API_KEY:?FARO_API_KEY is required}
      PROJECTS: ${PROJECTS:-}
      FARO_RATE: ${FARO_RATE:-100}
      FARO_BURST: ${FARO_BURST:-200}
      FARO_MAX_PAYLOAD: ${FARO_MAX_PAYLOAD:-5MiB}
      HOST_MAP: ${HOST_MAP:-}
      RESERVED_SUBDOMAINS: ${RESERVED_SUBDOMAINS:-}
      TENANT_HOST_REGEX: ${TENANT_HOST_REGEX:-}
    volumes:
      - type: bind
        source: ./config/alloy/config.bd379961.alloy
        target: /etc/alloy/config.bd379961.alloy
        content: |2
          // grafana-coolify - main Alloy pipeline (spec 7.1).
          // In: OTLP on 4317/4318 (internal, and relayed by alloy-gateway) and Faro on 12347 (public).
          // Out: traces -> Tempo, logs -> Loki, metrics -> Prometheus.
          // Every runtime value comes from sys.env(); Coolify writes this file byte for byte.

          logging {
            level  = "info"
            format = "logfmt"
          }

          // Persistent sending queue of the three OTLP exporters (spec 9.2).
          otelcol.storage.file "queue" {
            directory = sys.env("ALLOY_QUEUE_DIR")
          }

          // ------------------------------------------------------------------ OTLP path
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = sys.env("BIND_ADDR") + ":4317"
            }

            http {
              endpoint = sys.env("BIND_ADDR") + ":4318"
            }

            output {
              logs    = [otelcol.processor.memory_limiter.default.input]
              metrics = [otelcol.processor.memory_limiter.default.input]
              traces  = [otelcol.processor.memory_limiter.default.input]
            }
          }

          otelcol.processor.memory_limiter "default" {
            check_interval         = "1s"
            limit_percentage       = 80
            spike_limit_percentage = 20

            output {
              logs    = [otelcol.processor.transform.default.input]
              metrics = [otelcol.processor.transform.default.input]
              traces  = [otelcol.processor.transform.default.input]
            }
          }

          // 1. Short env: deployment.environment.name (or legacy deployment.environment) -> env,
          //    original attribute deleted (spec 6.1).
          // 2. Masking safety net (spec 8.1), same rule set on every attribute map and on a map log body:
          //    - keys matching authorization|cookie|password|token|secret are deleted, whatever the value
          //      type (replace_all_patterns only rewrites strings, and http.request.header.* are arrays);
          //    - in string values: Bearer tokens and key=value / "key":"value" secrets -> [redacted],
          //      emails -> [email];
          //    - card numbers -> [card] in free text only (string body, message, exception.*,
          //      span status message), before IP hashing so a digest is never rewritten;
          //    - IPv4/IPv6 -> SHA256(IP_HASH_SALT + ip), except under keys holding a version or a user
          //      agent (a browser version 128.0.0.0 is not an address).
          //    Residual: a map body is masked at its top level only; nested maps and arrays (in the body
          //    or in attributes) pass unchanged, OTTL having no stable function that walks them.
          //    Regexes are RE2; backticks are Alloy raw strings.
          otelcol.processor.transform "default" {
            error_mode = "ignore"

            trace_statements {
              context    = "resource"
              statements = [
                `set(resource.attributes["env"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil`,
                `set(resource.attributes["env"], resource.attributes["deployment.environment"]) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["deployment.environment"] != nil`,
                `delete_key(resource.attributes, "deployment.environment.name")`,
                `delete_key(resource.attributes, "deployment.environment")`,
                `delete_matching_keys(resource.attributes, "(?i).*(authorization|cookie|password|token|secret).*")`,
                `replace_all_patterns(resource.attributes, "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(resource.attributes, "value", "(?i)\\b([\\w-]*(?:authorization|cookie|password|token|secret)[\\w-]*)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(resource.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `set(cache["ip"], resource.attributes)`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(resource.attributes, cache["ip"], "upsert")`,
              ]
            }
            trace_statements {
              context    = "span"
              statements = [
                `delete_matching_keys(span.attributes, "(?i).*(authorization|cookie|password|token|secret).*")`,
                `replace_all_patterns(span.attributes, "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(span.attributes, "value", "(?i)\\b([\\w-]*(?:authorization|cookie|password|token|secret)[\\w-]*)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(span.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `replace_pattern(span.attributes["exception.message"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where span.attributes["exception.message"] != nil`,
                `replace_pattern(span.attributes["exception.stacktrace"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where span.attributes["exception.stacktrace"] != nil`,
                `set(cache["ip"], span.attributes)`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(span.attributes, cache["ip"], "upsert")`,
                `replace_pattern(span.status.message, "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
