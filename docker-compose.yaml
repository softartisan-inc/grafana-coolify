            }
            log_statements {
              context    = "log"
              statements = [
                `replace_pattern(log.body, "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]") where IsString(log.body)`,
                `replace_pattern(log.body, "(?i)\\b([\\w-]*(?:authorization|cookie|password|token|secret)[\\w-]*)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]") where IsString(log.body)`,
                `replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]") where IsString(log.body)`,
                `replace_pattern(log.body, "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where IsString(log.body)`,
                `replace_pattern(log.body, "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256) where IsString(log.body)`,
                `delete_matching_keys(log.body, "(?i).*(authorization|cookie|password|token|secret).*") where IsMap(log.body)`,
                `replace_all_patterns(log.body, "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]") where IsMap(log.body)`,
                `replace_all_patterns(log.body, "value", "(?i)\\b([\\w-]*(?:authorization|cookie|password|token|secret)[\\w-]*)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]") where IsMap(log.body)`,
                `replace_all_patterns(log.body, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]") where IsMap(log.body)`,
                `replace_pattern(log.body["message"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where IsMap(log.body)`,
                `replace_pattern(log.body["exception.message"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where IsMap(log.body)`,
                `replace_pattern(log.body["exception.stacktrace"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where IsMap(log.body)`,
                `set(cache["body_ip"], log.body) where IsMap(log.body)`,
                `delete_matching_keys(cache["body_ip"], "(?i).*(version|user_agent).*") where IsMap(log.body)`,
                `replace_all_patterns(cache["body_ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256) where IsMap(log.body)`,
                `merge_maps(log.body, cache["body_ip"], "upsert") where IsMap(log.body)`,
                `delete_matching_keys(log.attributes, "(?i).*(authorization|cookie|password|token|secret).*")`,
                `replace_all_patterns(log.attributes, "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(log.attributes, "value", "(?i)\\b([\\w-]*(?:authorization|cookie|password|token|secret)[\\w-]*)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(log.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `replace_pattern(log.attributes["message"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where log.attributes["message"] != nil`,
                `replace_pattern(log.attributes["exception.message"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where log.attributes["exception.message"] != nil`,
                `replace_pattern(log.attributes["exception.stacktrace"], "\\b(?:\\d[ -]?){12,18}\\d\\b", "[card]") where log.attributes["exception.stacktrace"] != nil`,
                `set(cache["ip"], log.attributes)`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(log.attributes, cache["ip"], "upsert")`,
              ]
            }
            metric_statements {
              context    = "resource"
              statements = [
                `set(resource.attributes["env"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil`,
                `set(resource.attributes["env"], resource.attributes["deployment.environment"]) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["deployment.environment"] != nil`,
                `delete_key(resource.attributes, "deployment.environment.name")`,
                `delete_key(resource.attributes, "deployment.environment")`,
                `delete_matching_keys(resource.attributes, "(?i).*(authorization|cookie|password|token|secret).*")`,
                `replace_all_patterns(resource.attributes, "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(resource.attributes, "value", "(?i)\\b([\\w-]*(?:authorization|cookie|password|token|secret)[\\w-]*)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(resource.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `set(cache["ip"], resource.attributes)`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(resource.attributes, cache["ip"], "upsert")`,
              ]
            }
            metric_statements {
              context    = "datapoint"
              statements = [
                `delete_matching_keys(datapoint.attributes, "(?i).*(authorization|cookie|password|token|secret).*")`,
                `replace_all_patterns(datapoint.attributes, "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(datapoint.attributes, "value", "(?i)\\b([\\w-]*(?:authorization|cookie|password|token|secret)[\\w-]*)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(datapoint.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `set(cache["ip"], datapoint.attributes)`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(datapoint.attributes, cache["ip"], "upsert")`,
