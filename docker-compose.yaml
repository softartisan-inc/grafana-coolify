                `delete_matching_keys(cache["flat"], "^.*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-].*|[A-Z].*)?$")`,
                `replace_all_patterns(cache["flat"], "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(cache["flat"], "value", "\\b([\\w-]*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-][\\w-]*|[A-Z][\\w-]*)?)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?i:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(cache["flat"], "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `set(cache["ip"], cache["flat"])`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(cache["flat"], cache["ip"], "upsert")`,
                `set(resource.attributes, cache["flat"]) where cache["flat"] != cache["orig"]`,
              ]
            }
            metric_statements {
              context    = "scope"
              statements = [
                `set(cache["flat"], scope.attributes)`,
                `flatten(cache["flat"])`,
                `set(cache["orig"], cache["flat"])`,
                `delete_matching_keys(cache["flat"], "^.*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-].*|[A-Z].*)?$")`,
                `replace_all_patterns(cache["flat"], "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(cache["flat"], "value", "\\b([\\w-]*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-][\\w-]*|[A-Z][\\w-]*)?)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?i:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(cache["flat"], "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `set(cache["ip"], cache["flat"])`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(cache["flat"], cache["ip"], "upsert")`,
                `set(scope.attributes, cache["flat"]) where cache["flat"] != cache["orig"]`,
              ]
            }
            metric_statements {
              context    = "datapoint"
              statements = [
                `set(cache["flat"], datapoint.attributes)`,
                `flatten(cache["flat"])`,
                `set(cache["orig"], cache["flat"])`,
                `delete_matching_keys(cache["flat"], "^.*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-].*|[A-Z].*)?$")`,
                `replace_all_patterns(cache["flat"], "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")`,
                `replace_all_patterns(cache["flat"], "value", "\\b([\\w-]*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-][\\w-]*|[A-Z][\\w-]*)?)(\\x22?\\s*[:=]\\s*\\x22?)(?:(?i:basic|digest|token|apikey)\\s+)?[^\\s\\x22&,;]+", "${1}${2}[redacted]")`,
                `replace_all_patterns(cache["flat"], "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[email]")`,
                `set(cache["ip"], cache["flat"])`,
                `delete_matching_keys(cache["ip"], "(?i).*(version|user_agent).*")`,
                `replace_all_patterns(cache["ip"], "value", "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)", "` + sys.env("IP_HASH_SALT") + `${0}", SHA256)`,
                `merge_maps(cache["flat"], cache["ip"], "upsert")`,
                `set(datapoint.attributes, cache["flat"]) where cache["flat"] != cache["orig"]`,
              ]
            }
            output {
              logs    = [otelcol.processor.filter.default.input]
              metrics = [otelcol.processor.filter.default.input]
              traces  = [otelcol.processor.filter.default.input]
            }
          }
          otelcol.processor.filter "default" {
            error_mode = "ignore"
            traces {
              span = [
                `resource.attributes["project"] == nil or resource.attributes["project"] == "" or resource.attributes["env"] == nil or resource.attributes["env"] == "" or (resource.attributes["env"] != "prod" and resource.attributes["env"] != "preprod")`,
              ]
            }
            logs {
              log_record = [
                `resource.attributes["project"] == nil or resource.attributes["project"] == "" or resource.attributes["env"] == nil or resource.attributes["env"] == "" or (resource.attributes["env"] != "prod" and resource.attributes["env"] != "preprod")`,
              ]
            }
            metrics {
              datapoint = [
                `resource.attributes["project"] == nil or resource.attributes["project"] == "" or resource.attributes["env"] == nil or resource.attributes["env"] == "" or (resource.attributes["env"] != "prod" and resource.attributes["env"] != "preprod")`,
              ]
            }
            output {
              logs    = [otelcol.processor.batch.default.input]
              metrics = [otelcol.processor.batch.default.input]
              traces  = [otelcol.processor.batch.default.input]
            }
          }
          otelcol.processor.batch "default" {
            send_batch_size     = 1024
            send_batch_max_size = 2048
            output {
              logs    = [otelcol.exporter.otlphttp.loki.input]
              metrics = [otelcol.exporter.otlphttp.prometheus.input]
              traces  = [otelcol.exporter.otlp.tempo.input]
            }
          }
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo:4317"
              tls {
                insecure = true
              }
            }
            sending_queue {
              enabled    = true
              queue_size = 1000
              storage    = otelcol.storage.file.queue.handler
            }
            retry_on_failure {
              max_elapsed_time = "1h"
            }
          }
          otelcol.exporter.otlphttp "loki" {
            client {
              endpoint = "http://loki:3100/otlp"
            }
            sending_queue {
              enabled    = true
              queue_size = 1000
              storage    = otelcol.storage.file.queue.handler
            }
            retry_on_failure {
              max_elapsed_time = "1h"
            }
          }
          otelcol.exporter.otlphttp "prometheus" {
            client {
              endpoint = "http://prometheus:9090/api/v1/otlp"
            }
            sending_queue {
              enabled    = true
              queue_size = 1000
              storage    = otelcol.storage.file.queue.handler
            }
            retry_on_failure {
              max_elapsed_time = "1h"
            }
          }
          faro.receiver "default" {
            server {
              listen_address = sys.env("BIND_ADDR")
              listen_port    = 12347
              api_key = sys.env("FARO_API_KEY")
              cors_allowed_origins     = []
              max_allowed_payload_size = coalesce(sys.env("FARO_MAX_PAYLOAD"), "5MiB")
              rate_limiting {
                enabled    = true
                rate       = coalesce(sys.env("FARO_RATE"), "100")
                burst_size = coalesce(sys.env("FARO_BURST"), "200")
              }
            }
            output {
              logs   = [loki.process.faro.receiver]
              traces = [otelcol.processor.memory_limiter.faro.input]
            }
          }
          otelcol.processor.memory_limiter "faro" {
            check_interval         = "1s"
            limit_percentage       = 80
            spike_limit_percentage = 20
            output {
              traces = [otelcol.processor.transform.faro.input]
            }
          }
          otelcol.processor.transform "faro" {
            error_mode = "ignore"
            trace_statements {
              context    = "resource"
              statements = [
                `set(resource.attributes["project"], resource.attributes["service.namespace"]) where resource.attributes["project"] == nil and resource.attributes["service.namespace"] != nil`,
                `set(resource.attributes["project"], resource.attributes["app.namespace"]) where resource.attributes["project"] == nil and resource.attributes["app.namespace"] != nil`,
                `set(resource.attributes["env"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil`,
                `set(resource.attributes["env"], resource.attributes["deployment.environment"]) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["deployment.environment"] != nil`,
                `delete_key(resource.attributes, "deployment.environment.name")`,
                `delete_key(resource.attributes, "deployment.environment")`,
                `delete_key(resource.attributes, "env") where resource.attributes["env"] != nil and (not IsMatch(resource.attributes["env"], "^[a-z0-9-]+$") or IsMatch(resource.attributes["env"], "^(` + string.replace(sys.env("RESERVED_SUBDOMAINS"), ",", "|") + `)$"))`,
                `delete_key(resource.attributes, "tenant") where resource.attributes["tenant"] != nil and (not IsMatch(resource.attributes["tenant"], "^[a-z0-9-]+$") or IsMatch(resource.attributes["tenant"], "^(` + string.replace(sys.env("RESERVED_SUBDOMAINS"), ",", "|") + `)$"))`,
              ]
            }
            trace_statements {
              context    = "span"
              statements = [
                `delete_key(span.attributes, "tenant") where span.attributes["tenant"] != nil and (not IsMatch(span.attributes["tenant"], "^[a-z0-9-]+$") or IsMatch(span.attributes["tenant"], "^(` + string.replace(sys.env("RESERVED_SUBDOMAINS"), ",", "|") + `)$"))`,
              ]
            }
            output {
              traces = [otelcol.processor.filter.faro.input]
            }
          }
          otelcol.processor.filter "faro" {
            error_mode = "ignore"
            traces {
              span = [
                `not IsMatch("` + sys.env("PROJECTS") + `", "^$") and not IsMatch(resource.attributes["project"], "^(` + string.replace(sys.env("PROJECTS"), ",", "|") + `)$")`,
                `resource.attributes["service.name"] == nil or resource.attributes["service.name"] == "" or (not IsMatch(resource.attributes["service.name"], "^(` + string.replace(sys.env("FARO_SERVICES"), ",", "|") + `)$") and not IsMatch(resource.attributes["service.name"], "^(?:(?:` + string.replace(string.replace(string.replace(string.replace(sys.env("HOST_MAP"), ".", "\\\\."), "=", "=)?"), ":", "(?::"), ",", ")?|(?:") + `)?)$"))`,
              ]
            }
            output {
              traces = [otelcol.processor.transform.default.input]
            }
          }
          loki.process "faro" {
            forward_to = [loki.write.loki.receiver]
            stage.logfmt {
              mapping = {
                "gc_page_url"        = "page_url",
                "gc_app_name"        = "app_name",
                "gc_app_namespace"   = "app_namespace",
                "gc_app_environment" = "app_environment",
                "gc_client_tenant"   = "session_attr_tenant",
                "gc_level"           = "level",
                "trace_id"           = "traceID",
              }
            }
            stage.regex {
              source     = "gc_page_url"
              expression = `^[A-Za-z][A-Za-z0-9+.-]*://(?:[^@/?#]*@)?(?P<gc_host>[^:/?#]+)`
            }
            stage.template {
              source   = "gc_host"
              template = "{{ ToLower .Value }}"
            }
            stage.template {
              source   = "gc_host_map"
              template = "," + sys.env("HOST_MAP")
            }
            stage.template {
              source   = "gc_reserved"
              template = "," + sys.env("RESERVED_SUBDOMAINS")
            }
            stage.template {
              source   = "gc_projects"
              template = "," + sys.env("PROJECTS")
            }
            stage.template {
              source   = "gc_services"
              template = "," + sys.env("FARO_SERVICES")
            }
            stage.template {
              source   = "gc_hm_hit"
              template = `{{ $h := .gc_host }}{{ $r := "" }}{{ if $h }}{{ range $e := splitList "," .gc_host_map }}{{ $kv := splitList "=" $e }}{{ if and (eq (len $kv) 2) (eq (index $kv 0) $h) }}{{ $r = index $kv 1 }}{{ end }}{{ end }}{{ end }}{{ $r }}`
            }
            stage.regex {
              source     = "gc_hm_hit"
              expression = `^(?P<gc_hm_service>[^:]+):(?P<gc_hm_env>.+)$`
            }
            stage.template {
              source   = "gc_hm_services"
              template = `{{ range $e := splitList "," .gc_host_map }}{{ $kv := splitList "=" $e }}{{ if eq (len $kv) 2 }},{{ index (splitList ":" (index $kv 1)) 0 }}{{ end }}{{ end }}`
            }
            stage.regex {
              source     = "gc_host"
              expression = "(?P<gc_host_match>" + coalesce(sys.env("TENANT_HOST_REGEX"), "[^\\s\\S]") + ")"
            }
            stage.template {
              source   = "env"
              template = `{{ if .gc_hm_env }}{{ .gc_hm_env }}{{ else if .gc_host_match }}{{ if .dev }}preprod{{ else }}prod{{ end }}{{ else }}{{ with .gc_app_environment }}{{ . }}{{ end }}{{ end }}`
            }
            stage.template {
              source   = "tenant"
              template = `{{ if .gc_hm_env }}{{ else if .gc_host_match }}{{ if not (has .sub (splitList "," .gc_reserved)) }}{{ .sub }}{{ end }}{{ else }}{{ with .gc_client_tenant }}{{ if and (regexMatch "^[a-z0-9-]+$" .) (not (has . (splitList "," $.gc_reserved))) }}{{ . }}{{ end }}{{ end }}{{ end }}`
            }
            stage.template {
              source   = "service_name"
              template = `{{ if .gc_hm_service }}{{ .gc_hm_service }}{{ else }}{{ with .gc_app_name }}{{ . }}{{ end }}{{ end }}`
            }
            stage.template {
              source   = "project"
              template = "{{ with .gc_app_namespace }}{{ . }}{{ end }}"
            }
            stage.template {
              source   = "trace_id"
              template = `{{ with .trace_id }}{{ if regexMatch "^[0-9a-f]{32}$" . }}{{ . }}{{ end }}{{ end }}`
            }
            stage.template {
              source   = "detected_level"
              template = `{{ with .gc_level }}{{ if has . (list "unknown" "debug" "info" "warn" "error" "fatal" "critical" "trace") }}{{ . }}{{ end }}{{ end }}`
            }
            stage.labels {
              values = {
                project      = "",
                env          = "",
                service_name = "",
              }
            }
            stage.structured_metadata {
              values = {
                tenant         = "",
                trace_id       = "",
                detected_level = "",
              }
            }
            stage.template {
              source   = "gc_reject"
              template = `{{ if not .project }}missing_project{{ else if not (regexMatch "^[a-z0-9][a-z0-9-]{0,63}$" .project) }}invalid_project{{ else if and (ne .gc_projects ",") (not (has .project (splitList "," .gc_projects))) }}unknown_project{{ else if not .env }}missing_env{{ else if not (has .env (list "prod" "preprod")) }}invalid_env{{ else if not .service_name }}invalid_service{{ else if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" .service_name) }}invalid_service{{ else if not (or (has .service_name (splitList "," .gc_services)) (has .service_name (splitList "," .gc_hm_services))) }}unknown_service{{ end }}`
            }
            stage.drop {
              source              = "gc_reject"
              value               = "missing_project"
              drop_counter_reason = "missing_project"
            }
            stage.drop {
              source              = "gc_reject"
              value               = "invalid_project"
              drop_counter_reason = "invalid_project"
            }
            stage.drop {
              source              = "gc_reject"
              value               = "unknown_project"
              drop_counter_reason = "unknown_project"
            }
            stage.drop {
              source              = "gc_reject"
              value               = "missing_env"
              drop_counter_reason = "missing_env"
            }
            stage.drop {
              source              = "gc_reject"
              value               = "invalid_env"
              drop_counter_reason = "invalid_env"
            }
            stage.drop {
              source              = "gc_reject"
              value               = "invalid_service"
              drop_counter_reason = "invalid_service"
            }
            stage.drop {
              source              = "gc_reject"
              value               = "unknown_service"
              drop_counter_reason = "unknown_service"
            }
            stage.replace {
              expression = `((?:^|\s)[^\s="]+=(?:"(?:[^"\\]|\\.)*"|\S*))`
              replace    = `{{ if not (regexMatch "^\\s*[^\\s=\"]*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-][^\\s=\"]*|[A-Z][^\\s=\"]*)?=" .Value) }}{{ .Value }}{{ end }}`
            }
            stage.replace {
              expression = `(?i)\bbearer\s+([A-Za-z0-9._~+/=-]+)`
              replace    = "[redacted]"
            }
            stage.replace {
              expression = `\b[\w-]*(?i:authorization|cookies?|passwords?|passwd|token|secrets?|api[_-]?keys?)(?:[._-][\w-]*|[A-Z][\w-]*)?\\?"?\s*[:=]\s*\\?"?((?:(?i:basic|digest|token|apikey)\s+)?[^\s"\\&,;]+)`
              replace    = "[redacted]"
            }
            stage.replace {
              expression = `([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})`
              replace    = "[email]"
            }
            stage.replace {
              expression = `(?:^|\s)(?:message|value|stacktrace)=("(?:[^"\\]|\\.)*"|\S*)`
              replace    = `{{ regexReplaceAll "\\b(?:\\d[ -]?){12,18}\\d\\b" .Value "[card]" }}`
            }
            stage.replace {
              expression = `(?:^|\s)([^\s="]+=(?:"(?:[^"\\]|\\.)*"|\S*))`
              replace    = `{{ $kv := .Value }}{{ $k := regexFind "^[^\\s=\"]+" $kv }}{{ if not (regexMatch "^(browser_.*|sdk_.*|app_version|.*_id|.*_ms|.*timestamp.*|.*version.*|user_agent.*)$" $k) }}{{ range $ip := regexFindAll "(?:\\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\\b|\\b(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}\\b|\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b)" $kv -1 }}{{ $kv = replace $ip (Sha2Hash "` + sys.env("IP_HASH_SALT") + `" $ip) $kv }}{{ end }}{{ end }}{{ $kv }}`
            }
          }
          loki.write "loki" {
            endpoint {
              url = "http://loki:3100/loki/api/v1/push"
            }
          }
        read_only: true
      - alloy-data:/var/lib/alloy
    labels:
      # CORS first: every answer, 429 of the rate limit included, carries the CORS headers.
      - coolify.traefik.middlewares=gc-faro-cors@file,gc-faro-ratelimit@file,gc-faro-body@file
    expose:
      - "4317"
      - "4318"
      - "12345"
      - "12347"
    networks:
      default: {}
      coolify:
        aliases:
          - gc-alloy
    mem_limit: 768m
    cpus: 1.0

  alloy-gateway:
    image: grafana/alloy:v1.20.0
    restart: unless-stopped
    depends_on:
      config-guard:
        condition: service_completed_successfully
    user: "473:473"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - /etc/alloy/config.4d4ee358.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview
    environment:
      SERVICE_FQDN_ALLOY_GATEWAY_4318:
      BIND_ADDR: 0.0.0.0
    volumes:
      - type: bind
        source: ./config/alloy-gateway/config.4d4ee358.alloy
        target: /etc/alloy/config.4d4ee358.alloy
        content: |2
          logging {
            level  = "info"
            format = "logfmt"
          }
          otelcol.receiver.otlp "gateway" {
            http {
              endpoint = sys.env("BIND_ADDR") + ":4318"
            }
            output {
              logs    = [otelcol.exporter.otlp.alloy.input]
              metrics = [otelcol.exporter.otlp.alloy.input]
              traces  = [otelcol.exporter.otlp.alloy.input]
            }
          }
          otelcol.exporter.otlp "alloy" {
            client {
              endpoint = "alloy:4317"
              tls {
                insecure = true
              }
            }
            sending_queue {
              enabled = false
            }
            retry_on_failure {
              enabled = false
            }
          }
        read_only: true
    tmpfs:
      - /var/lib/alloy:mode=1777,size=64m
    labels:
      - coolify.traefik.middlewares=gc-otlp-auth@file
    expose:
      - "4318"
      - "12345"
    mem_limit: 256m
    cpus: 0.5

  grafana-setup:
    image: python:3.13-alpine
    restart: "no"
    depends_on:
      config-guard:
        condition: service_completed_successfully
    command:
      - python3
      - /opt/grafana-setup/setup.4ebe90a7.py
    environment:
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_SA_TOKEN: ${GRAFANA_SA_TOKEN:-}
      LOKI_INTERNAL_URL: ${LOKI_INTERNAL_URL:-}
      TEMPO_INTERNAL_URL: ${TEMPO_INTERNAL_URL:-}
      PROMETHEUS_INTERNAL_URL: ${PROMETHEUS_INTERNAL_URL:-}
      PROJECTS: ${PROJECTS:-}
      # Plan B content, downloaded at a fixed tag and checked by SHA-256 (spec 4.3).
      GRAFANA_SETUP_PINNED_URL: "https://raw.githubusercontent.com/softartisan-inc/grafana-coolify/grafana-setup-content-v1"
      GRAFANA_SETUP_FILES: "alerting.py=5c8cc8130da62873bdf392ec6dd32f9512a25dee7f42d9b0cc0b5ac70611674e;dashboards/gc-cardinality.json=627297b75136a04ecd4aea4d26a3d44d153d536a3f14a82359f51f7424ecb6e2;dashboards/gc-frontend.json=ea341f8609cc46b220d85b903150e7efa5c7af32774c5e2d6f005d994a6cb6ab;dashboards/gc-host.json=90ef9083bfaab82ac57191aa3f00008cbcc545db6c10f112f5352c6561a4bfb0;dashboards/gc-pipeline.json=fb18316522abe4fffee6078142ac5162c48d63670f1ef564c8f1be4900cde0d8;dashboards/gc-project.json=1eb7ec2cc4c944066e69930be9f1afd7bb984897e30361982eeb0a152b5f66fb;dashboards/gc-service.json=c0b95dc9ebebc9a9a18f4cf7a88049a9a788bb9e52b2792aba1e0cc786877c8c;dashboards.py=bf9f2b5bc00dcf1b803eb82fb712985d80c102662bbfcc4a5600eee872f69e19"
      GRAFANA_SETUP_MIRROR_URL: ${GRAFANA_SETUP_MIRROR_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_EMAILS: ${ALERT_EMAILS:-}
      ALERT_ERROR_RATE: ${ALERT_ERROR_RATE:-0.05}
      ALERT_P95_MS: ${ALERT_P95_MS:-1500}
      ALERT_SILENCE_MIN: ${ALERT_SILENCE_MIN:-15}
      ALERT_DISK_PCT: ${ALERT_DISK_PCT:-80}
      CARDINALITY_ALERT_THRESHOLD: ${CARDINALITY_ALERT_THRESHOLD:-200000}
      HOST_ENV: ${HOST_ENV:-prod}
    volumes:
      - type: bind
        source: ./config/grafana-setup/setup.4ebe90a7.py
        target: /opt/grafana-setup/setup.4ebe90a7.py
        content: |2
          #!/usr/bin/env python3
          """grafana-setup: idempotently provision Grafana (spec 10). Standard library only.

          1. Grafana >= 12.0; datasources (fixed UIDs, correlations of 7.3); folders. 2. Plan B content, too
          big for the compose (spec 4.3): downloaded (mirror, or this repository at a fixed tag), checked
          against GRAFANA_SETUP_FILES (path=sha256;...), imported only if all match; it provisions dashboards
          and alerting. Tokens are never written to the output.
          """

          import hashlib
          import http.client
          import importlib
          import json
          import os
          import re
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          MIN_MAJOR = 12
          LOKI_UID = "gc-loki"
          TEMPO_UID = "gc-tempo"
          PROMETHEUS_UID = "gc-prometheus"
          # Same rule as config-guard (guard.sh) for each item of PROJECTS.
          PROJECT_RE = re.compile(r"^[a-z0-9][a-z0-9-]{0,63}$")
          # Trace -> logs: every log of the trace, whatever its path (OTLP or Faro), via trace_id metadata.
          TRACE_TO_LOGS_QUERY = '{project=~".+"} | trace_id="${__trace.traceId}"'
          # Fields compared to decide whether an existing datasource must be updated. isDefault is left to
          # the operator (Grafana makes the first datasource of an organisation the default one).
          COMPARED_FIELDS = ("name", "type", "access", "url", "basicAuth", "jsonData")
          # Folder of the shared dashboards and of the alert rules.
          SHARED_FOLDER_UID = "gc-grafana-coolify"
          SHARED_FOLDER_TITLE = "grafana-coolify"
          SECRET_VARIABLES = ("GRAFANA_SA_TOKEN", "TELEGRAM_BOT_TOKEN")
          CONTENT_DIR = "config/grafana-setup"
          CONTENT_RE = re.compile(r"^(?:dashboards/)?[a-z0-9_-]+\.(?:py|json)$")
          CONTENT_MODULES = ("alerting.py", "dashboards.py")
          SHA256_RE = re.compile(r"^[0-9a-f]{64}$")
          # GRAFANA_URL and the *_INTERNAL_URL variables: checked here, not by config-guard, so that a wrong
          # value stops grafana-setup alone and never the data path (Loki, Tempo, Prometheus, Alloy).
          HTTP_URL_RE = re.compile(r"^https?://\S+$")
          # Credentials of a URL (https://user:password@host), at the start of a value or inside a message.
          USERINFO_RE = re.compile(r"(https?://)[^/@\s'\"]*@")
          URL_VARIABLES = ("GRAFANA_URL", "LOKI_INTERNAL_URL", "TEMPO_INTERNAL_URL", "PROMETHEUS_INTERNAL_URL")
          SCHEMES = ("https://", "http://", "file:")
          MAX_CONTENT_BYTES = 2 * 1024 * 1024


          class SetupError(Exception):
              """A clean, explained stop (exit code 1)."""


          class InvalidRequest(SetupError):
              """A request urllib refuses to send (malformed URL): retrying cannot help."""


          class Grafana:
              def __init__(self, url, token, timeout=15):
                  self.url = url.rstrip("/")
                  self.token = token
                  self.timeout = timeout

              def request(self, method, path, body=None, headers=None):
                  """Return (status, parsed JSON or None). Never raises on HTTP error statuses."""
                  data = None if body is None else json.dumps(body).encode("utf-8")
                  try:
                      req = urllib.request.Request(self.url + path, data=data, method=method)
                  except ValueError as exc:  # unknown url type
                      raise self.invalid(method, path, exc) from None
                  req.add_header("Authorization", "Bearer " + self.token)
                  req.add_header("Accept", "application/json")
                  if data is not None:
                      req.add_header("Content-Type", "application/json")
                  for key, value in (headers or {}).items():
                      req.add_header(key, value)
                  try:
                      resp = urllib.request.urlopen(req, timeout=self.timeout)
                  except urllib.error.HTTPError as exc:
                      return exc.code, parse_json(exc.read())
                  except (ValueError, http.client.InvalidURL) as exc:
                      # Malformed URL (http.client.InvalidURL is an HTTPException, hence this clause first):
                      # retrying cannot help. Only the opening is covered: never a decoding error.
                      raise self.invalid(method, path, exc) from None
                  except (urllib.error.URLError, TimeoutError, ConnectionError, http.client.HTTPException) as exc:
                      raise SetupError(f"{method} {path}: Grafana unreachable ({reason(exc)})") from None
                  with resp:
                      try:
                          raw = resp.read()
                      except (OSError, http.client.HTTPException) as exc:
                          raise SetupError(f"{method} {path}: Grafana unreachable ({reason(exc)})") from None
                      return resp.status, parse_json(raw)

              def invalid(self, method, path, exc):
                  return InvalidRequest(f"{method} {path}: invalid request to {mask_userinfo(self.url)} ({mask_userinfo(str(exc))})")

              def expect(self, method, path, body=None, ok=(200,), headers=None):
                  status, payload = self.request(method, path, body, headers)
                  if status not in ok:
                      raise self.error(method, path, status, payload)
                  return payload

              @staticmethod
              def error(method, path, status, payload):
                  hint = ""
                  if status in (404, 410) and path.startswith("/api/v1/provisioning"):
                      hint = " (legacy alerting provisioning API unavailable: see README, « Alertes »)"
                  return SetupError(f"{method} {path}: HTTP {status}: {message_of(payload)}{hint}")


          def parse_json(raw):
              if not raw:
                  return None
              try:
                  return json.loads(raw)
              except ValueError:
                  return raw.decode("utf-8", "replace")[:200]


          def message_of(payload):
              return payload.get("message") if isinstance(payload, dict) else payload


          def reason(exc):
              return getattr(exc, "reason", None) or exc.__class__.__name__


          def wait_healthy(api, timeout=120, interval=3):
              deadline = time.monotonic() + timeout
              while True:
                  try:
                      status, payload = api.request("GET", "/api/health")
                      if status == 200 and isinstance(payload, dict):
                          return payload
                  except InvalidRequest:
                      raise
                  except SetupError:
                      if time.monotonic() >= deadline:
                          raise
                  if time.monotonic() >= deadline:
                      raise SetupError(f"Grafana not healthy after {timeout}s")
                  time.sleep(interval)


          def check_version(health):
              version = str(health.get("version", ""))
              match = re.match(r"^v?(\d+)\.", version)
              if not match:
                  raise SetupError(f"cannot read the Grafana version from /api/health: {version!r}")
              if int(match.group(1)) < MIN_MAJOR:
                  raise SetupError(f"Grafana {version} is not supported: version {MIN_MAJOR}.0 or later is required")
              return version


          def parse_projects(value):
              projects = []
              for item in (value or "").split(","):
                  name = item.strip()
                  if not name:
                      continue
                  if not PROJECT_RE.match(name):
                      raise SetupError(f"invalid project name in PROJECTS: {name!r} (expected [a-z0-9][a-z0-9-]{{0,63}})")
                  if name not in projects:
                      projects.append(name)
              return projects


          def datasources(loki_url, tempo_url, prometheus_url):
              """Desired datasources, with the correlations of spec 7.3."""
              return [
                  {
                      "uid": LOKI_UID,
                      "name": "Loki (grafana-coolify)",
                      "type": "loki",
                      "access": "proxy",
                      "url": loki_url,
                      "basicAuth": False,
                      "jsonData": {
                          "derivedFields": [
                              {
                                  "name": "trace_id",
                                  "matcherType": "label",
                                  "matcherRegex": "trace_id",
                                  "url": "${__value.raw}",
                                  "urlDisplayLabel": "Trace",
                                  "datasourceUid": TEMPO_UID,
                              }
                          ]
                      },
                  },
                  {
                      "uid": TEMPO_UID,
                      "name": "Tempo (grafana-coolify)",
                      "type": "tempo",
                      "access": "proxy",
                      "url": tempo_url,
                      "basicAuth": False,
                      "jsonData": {
                          "tracesToLogsV2": {
                              "datasourceUid": LOKI_UID,
                              "spanStartTimeShift": "-5m",
                              "spanEndTimeShift": "5m",
                              "filterByTraceID": True,
                              "filterBySpanID": False,
                              "customQuery": True,
                              "query": TRACE_TO_LOGS_QUERY,
                          },
                          "tracesToMetrics": {
                              "datasourceUid": PROMETHEUS_UID,
                              "spanStartTimeShift": "-5m",
                              "spanEndTimeShift": "5m",
                              "tags": [{"key": "service.name", "value": "service"}],
                              "queries": [
                                  {"name": "Request rate", "query": "sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))"},
                                  {
                                      "name": "p95 latency",
                                      "query": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$__tags}[5m])) by (le))",
                                  },
                              ],
                          },
                          "serviceMap": {"datasourceUid": PROMETHEUS_UID},
                          "nodeGraph": {"enabled": True},
                          "lokiSearch": {"datasourceUid": LOKI_UID},
                      },
                  },
                  {
                      "uid": PROMETHEUS_UID,
                      "name": "Prometheus (grafana-coolify)",
                      "type": "prometheus",
                      "access": "proxy",
                      "url": prometheus_url,
                      "basicAuth": False,
                      "jsonData": {
                          "httpMethod": "POST",
                          "exemplarTraceIdDestinations": [{"name": "trace_id", "datasourceUid": TEMPO_UID}],
                      },
                  },
              ]


          def ensure_datasource(api, desired):
              path = f"/api/datasources/uid/{desired['uid']}"
              status, current = api.request("GET", path)
              if status == 404:
                  api.expect("POST", "/api/datasources", desired)
                  return "created"
              if status != 200 or not isinstance(current, dict):
                  raise SetupError(f"GET {path}: HTTP {status}: {message_of(current)}")
              if all(current.get(field) == desired[field] for field in COMPARED_FIELDS):
                  return "unchanged"
              api.expect("PUT", path, dict(desired, isDefault=bool(current.get("isDefault"))))
              return "updated"


          def folder_uid(project):
              """gc-<project>, hashed past Grafana's 40-character UID limit."""
              uid = "gc-" + project
              return uid if len(uid) <= 40 else f"gc-{project[:28]}-{hashlib.sha256(project.encode()).hexdigest()[:8]}"


          def ensure_folder(api, uid, title):
              status, current = api.request("GET", f"/api/folders/{uid}")
              if status == 404:
                  api.expect("POST", "/api/folders", {"uid": uid, "title": title})
                  return "created"
              if status != 200 or not isinstance(current, dict):
                  raise SetupError(f"GET /api/folders/{uid}: HTTP {status}: {message_of(current)}")
              if current.get("title") == title:
                  return "unchanged"
              api.expect("PUT", f"/api/folders/{uid}", {"title": title, "overwrite": True})
              return "updated"


          def required(env, name):
              value = env.get(name, "").strip()
              if not value:
                  raise SetupError(f"{name} is required")
              return value


          def mask_userinfo(value):
              """Hide the credentials of a URL (https://user:password@host) before printing it."""
              return USERINFO_RE.sub(r"\1***@", value)


          def required_url(env, name):
              value = required(env, name)
              if not HTTP_URL_RE.match(value) or value.rstrip("/") in ("http:", "https:"):
                  raise SetupError(f"{name} must be an http:// or https:// URL, got {mask_userinfo(value)[:80]!r}")
              return value


          def parse_content(value):
              files = []
              for item in (value or "").split(";"):
                  if not item:
                      continue
                  path, separator, digest = item.partition("=")
                  if not separator or not CONTENT_RE.match(path) or not SHA256_RE.match(digest):
                      raise SetupError(f"malformed GRAFANA_SETUP_FILES entry: {item!r}")
                  files.append((path, digest))
              missing = [name for name in CONTENT_MODULES if name not in dict(files)]
              if missing:
                  raise SetupError(f"GRAFANA_SETUP_FILES does not list {', '.join(missing)}")
              return files


          def content_url(env):
              url = (env.get("GRAFANA_SETUP_MIRROR_URL") or "").strip() or (env.get("GRAFANA_SETUP_PINNED_URL") or "").strip()
              if not url.startswith(SCHEMES):
                  raise SetupError(f"the source of the plan B content must start with one of {', '.join(SCHEMES)}")
              return f"{url.rstrip('/')}/{CONTENT_DIR}"


          def fetch(url, attempts=3, timeout=30, pause=2, limit=MAX_CONTENT_BYTES):
              # Network errors and 5xx are retried; 4xx and file: errors are not.
              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(url, timeout=timeout) as resp:
                          data = resp.read(limit + 1)
                      if len(data) > limit:
                          raise SetupError(f"{url}: larger than {limit} bytes, refused")
                      return data
                  except urllib.error.HTTPError as exc:
                      if exc.code < 500 or attempt == attempts:
                          raise SetupError(f"{url}: HTTP {exc.code}") from None
                  except (urllib.error.URLError, OSError) as exc:
                      if url.startswith("file:") or attempt == attempts:
                          raise SetupError(f"{url}: {getattr(exc, 'reason', exc)}") from None
                  time.sleep(pause * attempt)
              raise SetupError(f"{url}: no attempt made")


          def download(base_url, files, target, pause=2):
              for path, digest in files:
                  data = fetch(f"{base_url}/{path}", pause=pause)
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != digest:
                      raise SetupError(f"{path}: SHA-256 {actual} differs from the pinned {digest}: nothing was run")
                  destination = Path(target) / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)


          def provision_content(api, env, projects, out, pause=2):
              files = parse_content(env.get("GRAFANA_SETUP_FILES"))
              base_url = content_url(env)
              with tempfile.TemporaryDirectory(prefix="grafana-setup-") as tmp:
                  download(base_url, files, tmp, pause)
                  out(f"grafana-setup: {len(files)} content files verified (SHA-256)")
                  sys.path.insert(0, tmp)
                  try:
                      alerting = importlib.import_module("alerting")
                      dashboards = importlib.import_module("dashboards")
                      for module in (alerting, dashboards):
                          if getattr(module, "__file__", None) is None:
                              raise SetupError(f"{module.__name__}.py is missing")
                      prepared = alerting.prepare(env, PROMETHEUS_UID)
                      dashboards.provision(api, projects, SHARED_FOLDER_UID, folder_uid, out)
                      alerting.provision(api, prepared, out)
                  finally:
                      sys.path.remove(tmp)


          def run(env, out=print, health_timeout=120):
              grafana_url, loki_url, tempo_url, prometheus_url = (required_url(env, name) for name in URL_VARIABLES)
              api = Grafana(grafana_url, required(env, "GRAFANA_SA_TOKEN"))
              desired = datasources(loki_url, tempo_url, prometheus_url)
              projects = parse_projects(env.get("PROJECTS", ""))
              version = check_version(wait_healthy(api, timeout=health_timeout))
              out(f"grafana-setup: Grafana {version}")
              for datasource in desired:
                  out(f"grafana-setup: datasource {datasource['uid']}: {ensure_datasource(api, datasource)}")
              out(f"grafana-setup: folder {SHARED_FOLDER_UID}: {ensure_folder(api, SHARED_FOLDER_UID, SHARED_FOLDER_TITLE)}")
              for project in projects:
                  out(f"grafana-setup: folder {folder_uid(project)}: {ensure_folder(api, folder_uid(project), project)}")
              out("grafana-setup: datasources and folders: done")
              try:
                  provision_content(api, env, projects, out)
              except (SetupError, ValueError) as exc:
                  raise SetupError(f"datasources and folders are provisioned, dashboards and alerts are not: {exc}") from None
              out("grafana-setup: done")


          def redact(message, env):
              for name in SECRET_VARIABLES:
                  secret = (env.get(name) or "").strip()
                  if secret:
                      message = message.replace(secret, "***")
              return message


          def main():
              try:
                  run(os.environ)
              except SetupError as exc:
                  print(f"grafana-setup: ERROR: {redact(str(exc), os.environ)}", file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
        read_only: true
    networks:
      default: {}
      # No alias: grafana-setup only calls GRAFANA_URL (grafana-<uuid>), which is on `coolify`.
      coolify: {}
    mem_limit: 128m
    cpus: 0.2

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  alloy-data:

networks:
  coolify:
    name: coolify
    external: true
