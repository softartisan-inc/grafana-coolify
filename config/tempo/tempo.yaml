# Tempo 2.x monolithic configuration for grafana-coolify.
# Environment variables are expanded by Tempo itself (-config.expand-env=true); compose.template.yaml
# sets every one of them (BIND_ADDR, TEMPO_DATA_DIR, TEMPO_RETENTION, TEMPO_MAX_ACTIVE_SERIES, ENABLE_EXEMPLARS).
# Operator variables carry their default here too: Coolify passes a variable emptied in its UI as
# an empty string and skips the compose `${VAR:-default}` (spike S5). Tempo's expander
# (drone/envsubst) applies `${VAR:-default}` to an empty value as to an unset one. Without it, an
# empty TEMPO_RETENTION is a 0s retention (the compactor deletes every block) and an empty
# TEMPO_MAX_ACTIVE_SERIES is 0, no limit on span-metrics series. Keep them equal to .env.example.
stream_over_http_enabled: true

server:
  http_listen_address: ${BIND_ADDR}
  http_listen_port: 3200
  # Internal module-to-module gRPC only; single-binary Tempo registers its rings on 127.0.0.1.
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${BIND_ADDR}:4317
        http:
          endpoint: ${BIND_ADDR}:4318

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

compactor:
  compaction:
    # Tempo 2.x key; re-check before any move to Tempo 3.x (spec 9.1).
    block_retention: ${TEMPO_RETENTION:-168h}

# Span-metrics and service graphs replace PHP request counters (spec 7.2).
metrics_generator:
  ring:
    kvstore:
      store: inmemory
  processor:
    span_metrics:
      dimensions:
        - project
        - env
        - tenant
        - http.route
    service_graphs:
      dimensions:
        - project
        - env
    # TraceQL metrics (`| rate()`, Traces Drilldown): without this processor Tempo answers
    # "localblocks processor not found". It answers the last 30 min (query_frontend
    # query_backend_after) from blocks it keeps on disk under traces_storage; older ranges read
    # the regular blocks. Keys checked against Tempo 2.10 (docs and -config.verify).
    local_blocks:
      # All spans, not only root/server ones, like the backend blocks: Drilldown "All spans" mode.
      filter_server_spans: false
      # Memory bound on traces being assembled (defaults: no count limit, 250 MB): 10000 traces,
      # the ingester's max_traces_per_user, and 100 MB, inside tempo's 1536m mem_limit.
      max_live_traces: 10000
      max_live_traces_bytes: 100000000
      # Disk bound: blocks of at most 100 MB, dropped 1h after completion (Tempo default).
      max_block_bytes: 100000000
      complete_block_timeout: 1h
  registry:
    external_labels:
      source: tempo
  storage:
    path: ${TEMPO_DATA_DIR}/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        # Exemplars need PROM_ENABLE_FEATURES=exemplar-storage on Prometheus (spec 7.3).
        send_exemplars: ${ENABLE_EXEMPLARS:-false}
  traces_storage:
    path: ${TEMPO_DATA_DIR}/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: ${TEMPO_DATA_DIR}/wal
    local:
      path: ${TEMPO_DATA_DIR}/blocks

overrides:
  defaults:
    metrics_generator:
      processors:
        - span-metrics
        - service-graphs
        - local-blocks
      max_active_series: ${TEMPO_MAX_ACTIVE_SERIES:-100000}

usage_report:
  reporting_enabled: false
