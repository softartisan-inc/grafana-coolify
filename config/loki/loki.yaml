# Loki single-binary configuration for grafana-coolify.
# Environment variables are expanded by Loki itself (-config.expand-env=true); compose.template.yaml
# sets every one of them (BIND_ADDR, LOKI_DATA_DIR, LOKI_RETENTION_*).
auth_enabled: false

server:
  http_listen_address: ${BIND_ADDR}
  http_listen_port: 3100
  # Internal module-to-module gRPC only (single binary).
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  log_level: info

common:
  path_prefix: ${LOKI_DATA_DIR}
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA_DIR}/chunks
      rules_directory: ${LOKI_DATA_DIR}/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: ${LOKI_DATA_DIR}/tsdb-index
    cache_location: ${LOKI_DATA_DIR}/tsdb-cache

compactor:
  working_directory: ${LOKI_DATA_DIR}/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  discover_log_levels: true
  # Global budgets of the single tenant, shared by the OTLP and Faro paths, stated explicitly.
  # Streams: one per (project, env, service_name); Faro names are closed (PROJECTS, FARO_SERVICES,
  # HOST_MAP), so the cap only guards against a runaway emitter. 10000 = twice Loki's default:
  # room for tens of projects x 2 envs x services, while every active stream holds ingester
  # memory (head block, open chunk) inside the 1536m limit.
  max_global_streams_per_user: 10000
  # Rate: the alloy-data backlog (up to 1000 batches of 2048 records per exporter) is pushed back
  # by 10 parallel consumers of ~2 MiB each; Loki's default 4 MB/s (burst 6) would answer 429 and
  # burn the 1 h retry window. 16 MB/s drains ~2 GiB in about two minutes; burst 32 MB covers the
  # 10 concurrent pushes.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Per-stream rate: Loki's default 3 MB/s (burst 15 MB) applies to each (project, env,
  # service_name) stream, whatever the tenant budget. A backlog is often one stream (the service
  # that logged during the outage): at 3 MB/s the 10 consumers get 429s, back off and a full queue
  # (1000 batches x 2048 records, ~8 GiB at ~4 KiB per record) would need ~45 min, too close to the
  # 1 h retry window. 8 MB/s = half the tenant rate: a single-stream backlog drains ~2 GiB in about
  # 4 min and ~8 GiB in ~17 min, while one stream (a replay, a noisy Faro stream) can never take the
  # whole tenant budget from the others. Burst 24 MB covers the 10 concurrent ~2 MiB pushes and
  # stays within the tenant burst (32 MB).
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 24MB
  # Every env except prod falls back to the short default (spec 9.1).
  retention_period: ${LOKI_RETENTION_DEFAULT}
  retention_stream:
    - selector: '{env="prod"}'
      priority: 1
      period: ${LOKI_RETENTION_PROD}
  # Only project, env and service.name become index labels; ignore_defaults stops Loki from
  # indexing service.instance.id and friends. trace_id/span_id of OTLP log records are stored as
  # structured metadata by Loki itself (spec 6.2).
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - project
            - env
            - service.name
        - action: structured_metadata
          attributes:
            - tenant

analytics:
  reporting_enabled: false
